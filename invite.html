<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>냠냠뿌직 친구 초대</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fff4e4;--paper:#fffaf2;--ink:#4a2f2a;--soft:#8a6a5f;--pink:#ff8fa3;--yellow:#ffd36e;--shadow:#e8cdb4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(rgba(255,255,255,.7) 2px,transparent 3px);background-size:24px 24px}
.card{width:100%;max-width:380px;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);padding:24px 20px;text-align:center}
img{width:120px;height:112px;image-rendering:pixelated}
h1{font-size:20px;margin:8px 0 6px}
p{font-size:14px;line-height:1.7;color:var(--soft);margin:0 0 14px}
.code{display:inline-block;font-size:26px;letter-spacing:5px;font-weight:700;background:#fff;border:3px solid var(--ink);padding:8px 14px;margin:2px 0 14px;font-family:ui-monospace,Menlo,monospace}
.btn{display:block;width:100%;font-size:16px;font-weight:700;border:3px solid var(--ink);padding:13px;margin:8px 0;background:var(--yellow);color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--ink);font-family:inherit}
.btn.pink{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:none}
small{display:block;font-size:12px;color:var(--soft);line-height:1.7;margin-top:14px}
.steps{text-align:left;font-size:13px;color:var(--ink);line-height:1.8;background:#fff;border:2px dashed var(--shadow);padding:10px 12px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <img id="ny" alt="냠이" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAcCAYAAAB2+A+pAAAA7klEQVR42s2WzQ3CMAyFMwsHhugSbAITMEKvXNmBYThy4dIzCwQpUmhqnOT5YQqVnqq2dr7EP01CWOGKu30s72EtqNRP4E3DYbuJpawgzR+CxvNlIQuc9m85ypVoK3MFZ2ftPWIDRwyBoDLXSIJfb7O+Aa3miQT26kMN6+LZAazlPsE982mKwl+Dc2487brtU37zsrP37n1qi22vKrwHBCbQ7OkX+DDOYsFiDDtYGVhuDiqcAnfCDIGZ3ycCzqtBwPzu9EFxUbvT43hKsoKzH3NseoMjEyht3aCMKHgLLKvaHSwHrR13LbbUGdnT9gkv3UgBUQf25wAAAABJRU5ErkJggg==">
  <h1 id="title">냠냠뿌직 친구 초대</h1>
  <p id="desc">친구가 초대를 보냈어요!<br>서로 먹은 음식을 볼 수 있어요.</p>
  <div class="code" id="code">--------</div>
  <a class="btn pink" id="open" href="#">앱에서 열기</a>
  <a class="btn" href="https://apps.apple.com/kr/app/%EB%83%A0%EB%83%A0%EB%BF%8C%EC%A7%81/id6821324359">앱이 없으면 App Store에서 받기</a>
  <div class="steps">
    <b>앱이 안 열리면</b><br>
    ① 위 코드를 복사해요 <button id="copy" style="font:inherit;font-size:12px;border:2px solid #4a2f2a;background:#fff;padding:1px 8px;cursor:pointer">코드 복사</button><br>
    ② 냠냠뿌직 › 친구 탭 › ‘친구 코드’ 칸에 붙여넣고 <b>코드로 추가</b><br>
    ③ 카카오톡에서 열었다면 오른쪽 아래 ⋯ › <b>다른 브라우저로 열기</b>
  </div>
  <small>초대는 한 번만 쓸 수 있고 7일 뒤 사라져요.<br>iPhone 전용 앱이에요.</small>
</div>
<script>
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var ok = c.length === 8;
  document.getElementById('code').textContent = ok ? c : '코드 없음';
  var open = document.getElementById('open');
  if (!ok) { document.getElementById('desc').textContent = '초대 링크가 올바르지 않아요. 친구에게 다시 받아주세요.'; open.style.display = 'none'; }
  else {
    var url = 'nyamppujik://invite?c=' + c;
    open.href = url;
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/KAKAOTALK/i.test(navigator.userAgent)) setTimeout(function () { location.href = url; }, 400);
  }
  document.getElementById('copy').onclick = function () {
    if (!ok) return;
    var b = this;
    (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { b.textContent = '복사됨!'; }, function () { prompt('코드를 복사하세요', c); });
  };
</script>
</body>
</html>
